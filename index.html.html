<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tank Arena: Mega Servers</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    background:#181818;
}

#hud{
    position:fixed;
    left:15px;
    top:15px;
    color:white;
    background:rgba(0,0,0,.55);
    padding:12px 16px;
    border-radius:10px;
    pointer-events:none;
    min-width:220px;
    font-size:14px;
}

#serverPanel{
    position:fixed;
    right:15px;
    top:15px;
    width:245px;
    max-height:420px;
    overflow:auto;
    background:rgba(0,0,0,.65);
    color:white;
    padding:12px;
    border-radius:12px;
}

#serverPanel h3{
    margin:0 0 10px;
    text-align:center;
}

.server{
    padding:7px;
    margin:4px 0;
    background:#292929;
    border-radius:6px;
    cursor:pointer;
}

.server:hover{
    background:#444;
}

#tankMenu{
    position:fixed;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:min(900px,95vw);
    max-height:180px;
    overflow:auto;
    background:rgba(0,0,0,.72);
    padding:10px;
    border-radius:12px;
    color:white;
}

.tankButton{
    display:inline-block;
    padding:7px 10px;
    margin:3px;
    background:#333;
    border:1px solid #555;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
}

.tankButton:hover{
    background:#555;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud"></div>

<div id="serverPanel">
    <h3>🌐 SERVERS</h3>
    <div id="servers"></div>
</div>

<div id="tankMenu"></div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);


/* =========================================================
   WORLD
========================================================= */

const WORLD = {
    width: 6000,
    height: 6000
};

let camera = {
    x: WORLD.width / 2,
    y: WORLD.height / 2
};


/* =========================================================
   RANDOM HELPERS
========================================================= */

function rand(min,max){
    return Math.random()*(max-min)+min;
}

function randint(min,max){
    return Math.floor(rand(min,max+1));
}

function choice(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}


/* =========================================================
   SERVER GENERATOR
========================================================= */

const serverWords1 = [
    "Crimson","Neon","Titan","Shadow","Quantum",
    "Meteor","Inferno","Omega","Solar","Void",
    "Phantom","Cyber","Thunder","Cosmic","Atomic",
    "Dragon","Hyper","Galaxy","Frozen","Eternal"
];

const serverWords2 = [
    "Valley","Citadel","Storm","Arena","Empire",
    "Frontier","Galaxy","Battleground","Zone","Realm",
    "Core","Kingdom","Sector","Fields","Network",
    "Warfare","Dimension","Territory","Station","Nexus"
];

const servers = [];

for(let i=0;i<20;i++){
    servers.push({
        name: choice(serverWords1)+" "+choice(serverWords2)+"-"+randint(10,99),
        players: randint(5,250),
        ping: randint(20,180)
    });
}

const serverDiv = document.getElementById("servers");

servers.forEach((server,i)=>{
    const div=document.createElement("div");
    div.className="server";
    div.innerHTML =
        `<b>${server.name}</b><br>
         👥 ${server.players} players
         &nbsp; 📡 ${server.ping}ms`;

    div.onclick=()=>{
        alert("Connected to "+server.name+"!");
    };

    serverDiv.appendChild(div);
});


/* =========================================================
   TANK DEFINITIONS
   22 DIFFERENT TANKS
========================================================= */

const TANKS = [

{
    name:"Twin",
    barrels:2,
    damage:500000,
    reload:.35,
    bulletSpeed:13,
    bulletSize:8,
    color:"#55aaff"
},

{
    name:"Triple",
    barrels:3,
    damage:650000,
    reload:.32,
    bulletSpeed:14,
    bulletSize:8,
    color:"#55ff88"
},

{
    name:"Quad",
    barrels:4,
    damage:800000,
    reload:.30,
    bulletSpeed:15,
    bulletSize:9,
    color:"#ffaa44"
},

{
    name:"Penta",
    barrels:5,
    damage:1000000,
    reload:.28,
    bulletSpeed:15,
    bulletSize:9,
    color:"#ff5555"
},

{
    name:"Hexa",
    barrels:6,
    damage:1200000,
    reload:.27,
    bulletSpeed:16,
    bulletSize:9,
    color:"#aa55ff"
},

{
    name:"Octo",
    barrels:8,
    damage:1500000,
    reload:.25,
    bulletSpeed:17,
    bulletSize:10,
    color:"#55ffff"
},

{
    name:"Deca",
    barrels:10,
    damage:1800000,
    reload:.23,
    bulletSpeed:18,
    bulletSize:10,
    color:"#ffff55"
},

{
    name:"Dreadnought",
    barrels:12,
    damage:2200000,
    reload:.22,
    bulletSpeed:18,
    bulletSize:11,
    color:"#ff8844"
},

{
    name:"Storm",
    barrels:14,
    damage:2600000,
    reload:.20,
    bulletSpeed:19,
    bulletSize:11,
    color:"#44aaff"
},

{
    name:"Hydra",
    barrels:16,
    damage:3000000,
    reload:.19,
    bulletSpeed:20,
    bulletSize:12,
    color:"#44ff44"
},

{
    name:"Annihilator",
    barrels:18,
    damage:3500000,
    reload:.18,
    bulletSpeed:21,
    bulletSize:12,
    color:"#ff4444"
},

{
    name:"Overlord",
    barrels:20,
    damage:4000000,
    reload:.17,
    bulletSpeed:21,
    bulletSize:13,
    color:"#cc44ff"
},

{
    name:"Twenty-Two",
    barrels:22,
    damage:5000000,
    reload:.15,
    bulletSpeed:22,
    bulletSize:13,
    color:"#ffffff"
},

{
    name:"Mega Shotgun",
    barrels:10,
    damage:6500000,
    reload:.45,
    bulletSpeed:17,
    bulletSize:15,
    spread:.65,
    color:"#ffbb44"
},

{
    name:"Rocket Tank",
    barrels:6,
    damage:8000000,
    reload:.6,
    bulletSpeed:12,
    bulletSize:16,
    rocket:true,
    color:"#ff6644"
},

{
    name:"Missile Array",
    barrels:12,
    damage:10000000,
    reload:.8,
    bulletSpeed:10,
    bulletSize:14,
    missile:true,
    color:"#ff44aa"
},

{
    name:"Nuke Launcher",
    barrels:2,
    damage:25000000,
    reload:2.5,
    bulletSpeed:7,
    bulletSize:22,
    nuke:true,
    color:"#ffffff"
},

{
    name:"Nuclear Array",
    barrels:8,
    damage:50000000,
    reload:3,
    bulletSpeed:7,
    bulletSize:20,
    nuke:true,
    color:"#ffff44"
},

{
    name:"Galaxy Cannon",
    barrels:14,
    damage:100000000,
    reload:2,
    bulletSpeed:8,
    bulletSize:18,
    nuke:true,
    color:"#aa88ff"
},

{
    name:"Titan",
    barrels:18,
    damage:250000000,
    reload:1.8,
    bulletSpeed:9,
    bulletSize:20,
    nuke:true,
    color:"#ff3333"
},

{
    name:"World Breaker",
    barrels:20,
    damage:500000000,
    reload:2,
    bulletSpeed:8,
    bulletSize:25,
    nuke:true,
    color:"#ff8800"
},

{
    name:"OMEGA",
    barrels:22,
    damage:1000000000,
    reload:1.5,
    bulletSpeed:10,
    bulletSize:30,
    nuke:true,
    color:"#00ffff"
}

];


/* =========================================================
   PLAYER
========================================================= */

let selectedTank = TANKS[0];

const player = {
    x:WORLD.width/2,
    y:WORLD.height/2,

    radius:35,

    health:1000000000,
    maxHealth:1000000000,

    speed:7,

    angle:0,

    level:1000000,

    score:999999999999
};


/* =========================================================
   INPUT
========================================================= */

const keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key===" "){
        fire();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

const mouse={
    x:canvas.width/2,
    y:canvas.height/2,
    down:false
};

canvas.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

canvas.addEventListener("mousedown",()=>{
    mouse.down=true;
});

canvas.addEventListener("mouseup",()=>{
    mouse.down=false;
});


/* =========================================================
   BULLETS / PROJECTILES
========================================================= */

const bullets=[];

function fire(){

    const tank=selectedTank;

    for(let i=0;i<tank.barrels;i++){

        const center=(tank.barrels-1)/2;

        let offset=i-center;

        let angle =
            player.angle +
            offset*0.055;

        if(tank.spread){
            angle += rand(-tank.spread,tank.spread);
        }

        let type="bullet";

        if(tank.nuke) type="nuke";
        else if(tank.missile) type="missile";
        else if(tank.rocket) type="rocket";

        bullets.push({
            x:player.x+Math.cos(angle)*45,
            y:player.y+Math.sin(angle)*45,

            vx:Math.cos(angle)*tank.bulletSpeed,
            vy:Math.sin(angle)*tank.bulletSpeed,

            damage:tank.damage,

            size:tank.bulletSize,

            life:600,

            type:type,

            color:tank.color
        });
    }
}


/* =========================================================
   ENEMIES
========================================================= */

const enemies=[];

for(let i=0;i<80;i++){

    enemies.push({
        x:rand(200,WORLD.width-200),
        y:rand(200,WORLD.height-200),

        radius:rand(18,38),

        health:rand(500000,20000000),
        maxHealth:0,

        angle:rand(0,Math.PI*2),

        color:choice([
            "#e44",
            "#4e4",
            "#48e",
            "#e8a",
            "#ea4"
        ])
    });

    enemies[i].maxHealth=enemies[i].health;
}


/* =========================================================
   PARTICLES
========================================================= */

const particles=[];

function explosion(x,y,size,color){

    for(let i=0;i<60;i++){

        const a=rand(0,Math.PI*2);
        const speed=rand(2,12);

        particles.push({
            x:x,
            y:y,

            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,

            size:rand(3,size/2),

            life:rand(20,70),

            color:color
        });
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    /* PLAYER MOVEMENT */

    let dx=0;
    let dy=0;

    if(keys["w"] || keys["arrowup"]) dy--;
    if(keys["s"] || keys["arrowdown"]) dy++;
    if(keys["a"] || keys["arrowleft"]) dx--;
    if(keys["d"] || keys["arrowright"]) dx++;

    if(dx||dy){

        const length=Math.hypot(dx,dy);

        dx/=length;
        dy/=length;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;
    }

    player.x=Math.max(50,Math.min(WORLD.width-50,player.x));
    player.y=Math.max(50,Math.min(WORLD.height-50,player.y));


    /* AIM */

    const worldMouseX =
        mouse.x-canvas.width/2+player.x;

    const worldMouseY =
        mouse.y-canvas.height/2+player.y;

    player.angle=
        Math.atan2(
            worldMouseY-player.y,
            worldMouseX-player.x
        );


    /* AUTO FIRE */

    if(mouse.down){
        fire();
    }


    /* BULLETS */

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.x+=b.vx;
        b.y+=b.vy;

        b.life--;

        if(b.life<=0){
            bullets.splice(i,1);
            continue;
        }


        /* NUCLEAR PROJECTILES */

        if(b.type==="nuke"){

            for(let j=enemies.length-1;j>=0;j--){

                const e=enemies[j];

                if(Math.hypot(b.x-e.x,b.y-e.y)<b.size+e.radius){

                    const blastRadius=300;

                    explosion(
                        b.x,
                        b.y,
                        blastRadius,
                        b.color
                    );

                    for(const target of enemies){

                        const distance=
                            Math.hypot(
                                b.x-target.x,
                                b.y-target.y
                            );

                        if(distance<blastRadius){

                            const multiplier=
                                1-distance/blastRadius;

                            target.health -=
                                b.damage*multiplier;
                        }
                    }

                    bullets.splice(i,1);
                    break;
                }
            }
        }


        /* NORMAL PROJECTILES */

        else{

            for(let j=enemies.length-1;j>=0;j--){

                const e=enemies[j];

                if(Math.hypot(b.x-e.x,b.y-e.y)
                    <b.size+e.radius){

                    e.health-=b.damage;

                    explosion(
                        b.x,
                        b.y,
                        25,
                        b.color
                    );

                    bullets.splice(i,1);

                    if(e.health<=0){

                        player.score+=
                            Math.floor(e.maxHealth);

                        e.x=rand(200,WORLD.width-200);
                        e.y=rand(200,WORLD.height-200);
                        e.health=rand(500000,20000000);
                        e.maxHealth=e.health;
                    }

                    break;
                }
            }
        }
    }


    /* ENEMIES */

    for(const e of enemies){

        const angle=
            Math.atan2(
                player.y-e.y,
                player.x-e.x
            );

        e.angle=angle;

        e.x+=Math.cos(angle)*.25;
        e.y+=Math.sin(angle)*.25;
    }


    /* PARTICLES */

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.96;
        p.vy*=.96;

        p.life--;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }


    /* CAMERA */

    camera.x=player.x;
    camera.y=player.y;
}


/* =========================================================
   DRAW GRID
========================================================= */

function drawGrid(){

    const grid=100;

    ctx.strokeStyle="#252525";
    ctx.lineWidth=1;

    const startX=
        -((camera.x-canvas.width/2)%grid);

    const startY=
        -((camera.y-canvas.height/2)%grid);

    for(let x=startX;x<canvas.width;x+=grid){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=startY;y<canvas.height;y+=grid){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}


/* =========================================================
   WORLD TO SCREEN
========================================================= */

function screenX(x){
    return x-camera.x+canvas.width/2;
}

function screenY(y){
    return y-camera.y+canvas.height/2;
}


/* =========================================================
   DRAW TANK
========================================================= */

function drawTank(x,y,angle,radius,color,barrels){

    const sx=screenX(x);
    const sy=screenY(y);

    ctx.save();

    ctx.translate(sx,sy);

    ctx.rotate(angle);


    /* BARRELS */

    for(let i=0;i<barrels;i++){

        const center=(barrels-1)/2;

        let offset=i-center;

        const spread=
            Math.min(
                .065,
                1/barrels*1.3
            );

        ctx.save();

        ctx.rotate(offset*spread);

        ctx.fillStyle="#777";

        ctx.fillRect(
            0,
            -6,
            55,
            12
        );

        ctx.strokeStyle="#111";
        ctx.strokeRect(
            0,
            -6,
            55,
            12
        );

        ctx.restore();
    }


    /* BODY */

    ctx.fillStyle=color;

    ctx.beginPath();
    ctx.arc(0,0,radius,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#111";
    ctx.lineWidth=4;
    ctx.stroke();


    /* CORE */

    ctx.fillStyle="#aaa";

    ctx.beginPath();
    ctx.arc(
        0,
        0,
        radius*.35,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGrid();


    /* WORLD BORDER */

    ctx.strokeStyle="#777";
    ctx.lineWidth=8;

    ctx.strokeRect(
        screenX(0),
        screenY(0),
        WORLD.width,
        WORLD.height
    );


    /* ENEMIES */

    for(const e of enemies){

        const sx=screenX(e.x);
        const sy=screenY(e.y);

        ctx.fillStyle=e.color;

        ctx.beginPath();
        ctx.arc(
            sx,
            sy,
            e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#111";
        ctx.lineWidth=3;
        ctx.stroke();


        /* HP BAR */

        ctx.fillStyle="#222";

        ctx.fillRect(
            sx-25,
            sy-e.radius-12,
            50,
            5
        );

        ctx.fillStyle="#4f4";

        ctx.fillRect(
            sx-25,
            sy-e.radius-12,
            50*Math.max(
                0,
                e.health/e.maxHealth
            ),
            5
        );
    }


    /* PROJECTILES */

    for(const b of bullets){

        const sx=screenX(b.x);
        const sy=screenY(b.y);

        if(b.type==="nuke"){

            ctx.shadowBlur=25;
            ctx.shadowColor=b.color;

            ctx.fillStyle=b.color;

            ctx.beginPath();
            ctx.arc(
                sx,
                sy,
                b.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.shadowBlur=0;
        }

        else if(b.type==="missile"){

            ctx.fillStyle=b.color;

            ctx.beginPath();

            ctx.moveTo(
                sx+Math.cos(Math.atan2(b.vy,b.vx))*20,
                sy+Math.sin(Math.atan2(b.vy,b.vx))*20
            );

            ctx.lineTo(
                sx+Math.cos(Math.atan2(b.vy,b.vx)+2.5)*12,
                sy+Math.sin(Math.atan2(b.vy,b.vx)+2.5)*12
            );

            ctx.lineTo(
                sx+Math.cos(Math.atan2(b.vy,b.vx)-2.5)*12,
                sy+Math.sin(Math.atan2(b.vy,b.vx)-2.5)*12
            );

            ctx.closePath();
            ctx.fill();
        }

        else{

            ctx.fillStyle=b.color;

            ctx.beginPath();

            ctx.arc(
                sx,
                sy,
                b.size,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }


    /* PARTICLES */

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life/70);

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            screenX(p.x),
            screenY(p.y),
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;


    /* PLAYER */

    drawTank(
        player.x,
        player.y,
        player.angle,
        player.radius,
        selectedTank.color,
        selectedTank.barrels
    );


    /* HUD */

    document.getElementById("hud").innerHTML=`
        <b>⚡ TANK ARENA</b><br><br>
        Tank: <b>${selectedTank.name}</b><br>
        Barrels: <b>${selectedTank.barrels}</b><br>
        Damage: <b>${selectedTank.damage.toLocaleString()}</b><br>
        Health: <b>${player.health.toLocaleString()}</b><br>
        Score: <b>${player.score.toLocaleString()}</b><br>
        Level: <b>${player.level.toLocaleString()}</b><br><br>
        WASD / Arrow Keys = Move<br>
        Mouse = Aim<br>
        Hold Mouse = Fire<br>
        Space = Fire
    `;
}


/* =========================================================
   TANK MENU
========================================================= */

const tankMenu=document.getElementById("tankMenu");

TANKS.forEach((tank,index)=>{

    const button=document.createElement("span");

    button.className="tankButton";

    button.innerHTML=
        `${tank.name} [${tank.barrels}🔫]`;

    button.onclick=()=>{
        selectedTank=tank;
    };

    tankMenu.appendChild(button);
});


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
